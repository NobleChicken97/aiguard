{% extends "base.html" %}
{% block title %}Memory Inspector{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h1>Memory Inspector</h1>
    <p>View the long-term facts the system has remembered about each user across sessions.</p>
  </div>
  <div class="stats">
    <div class="label">Facts</div>
    <div class="value" id="fact-count">0</div>
    <div class="muted">Loaded</div>
  </div>
</section>

<section class="grid" style="grid-template-columns: 1fr;">
  <article class="card rv">
    <div class="card-header">
      <h2>Lookup</h2>
      <span class="badge good">Long-term memory</span>
    </div>
    <div class="card-body">
      <form id="memory-form">
        <div class="row" style="align-items: stretch;">
          <input id="user-id-input" type="text" placeholder="Enter user id (e.g. web_user)" autocomplete="off" aria-label="User id"
                 style="flex: 1; min-width: 0;">
          <button class="button approve" type="submit">Load</button>
        </div>
      </form>

      <div id="facts-list" class="stack" style="margin-top: 1.25rem;">
        <div class="approval">
          <p class="muted" style="margin-bottom: 0;">Enter a user id to see persisted facts.</p>
        </div>
      </div>
    </div>
  </article>
</section>

<script>
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.getElementById('memory-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const userId = document.getElementById('user-id-input').value.trim();
    if (!userId) return;

    const list = document.getElementById('facts-list');
    list.innerHTML = '<div class="approval"><p class="muted" style="margin-bottom: 0;">Loading...</p></div>';

    try {
      const response = await fetch('/api/users/' + encodeURIComponent(userId) + '/memory');
      const data = await response.json();
      if (!response.ok) {
        list.innerHTML = '<div class="approval"><p class="muted" style="margin-bottom: 0;">Error: ' + escapeHtml(data.detail || 'Unknown error') + '</p></div>';
        return;
      }

      document.getElementById('fact-count').textContent = data.facts.length;

      if (data.facts.length === 0) {
        list.innerHTML = '<div class="approval"><p class="muted" style="margin-bottom: 0;">No facts stored for this user yet.</p></div>';
        return;
      }

      list.innerHTML = '';
      data.facts.forEach(fact => {
        const item = document.createElement('div');
        item.className = 'approval';
        item.innerHTML = `
          <p style="margin: 0 0 0.6rem;">${escapeHtml(fact.fact_text)}</p>
          <div class="row" style="justify-content: space-between; align-items: center;">
            <span class="badge good">${new Date(fact.created_at).toLocaleString()}</span>
            <span class="row" style="align-items: center;">
              <span class="muted">Session: ${escapeHtml(fact.source_session_id || 'unknown')}</span>
              <button class="button deny fact-delete" data-fact-id="${escapeHtml(fact.fact_id)}"
                      aria-label="Delete fact" style="padding: 0.35rem 0.7rem;">Delete</button>
            </span>
          </div>
        `;
        item.querySelector('.fact-delete').addEventListener('click', async () => {
          if (!confirm('Delete this fact? Future sessions will no longer see it.')) return;
          try {
            const del = await fetch('/api/users/' + encodeURIComponent(userId) + '/memory/' +
                                    encodeURIComponent(fact.fact_id), { method: 'DELETE' });
            if (del.ok) {
              item.remove();
              const countEl = document.getElementById('fact-count');
              countEl.textContent = Math.max(0, parseInt(countEl.textContent, 10) - 1);
            } else {
              alert('Could not delete fact (' + del.status + ').');
            }
          } catch (err) {
            alert('Network error: ' + err.message);
          }
        });
        list.appendChild(item);
      });
    } catch (err) {
      list.innerHTML = '<div class="approval"><p class="muted" style="margin-bottom: 0;">Network error: ' + escapeHtml(err.message) + '</p></div>';
    }
  });
</script>
{% endblock %}
