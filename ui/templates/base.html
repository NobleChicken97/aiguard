<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agentic Guardrails{% endblock %}</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(16, 22, 41, 0.88);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e5eefc;
      --muted: #a8b3c7;
      --accent: #7dd3fc;
      --accent-2: #f59e0b;
      --danger: #fb7185;
      --success: #34d399;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.12), transparent 28%),
        linear-gradient(180deg, #060816 0%, #0b1020 100%);
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .shell {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    .hero p { margin: 0.5rem 0 0; color: var(--muted); max-width: 70ch; }

    .stats {
      padding: 1rem 1.2rem;
      border: 1px solid var(--panel-border);
      border-radius: 1rem;
      background: var(--panel);
      box-shadow: var(--shadow);
      min-width: 190px;
      text-align: right;
    }

    .stats .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; }
    .stats .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 1.5fr;
      gap: 1rem;
    }

    .card {
      border: 1px solid var(--panel-border);
      border-radius: 1.1rem;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #d6e2f2;
    }

    .card-body { padding: 1rem 1.15rem 1.15rem; }

    .stack { display: grid; gap: 0.9rem; }

    .approval {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 0.95rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
    }

    .approval-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.7rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      padding: 0.32rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge.warn { background: rgba(245, 158, 11, 0.14); color: #fbbf24; }
    .badge.good { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; }
    .badge.bad { background: rgba(251, 113, 133, 0.14); color: #fda4af; }

    pre {
      margin: 0;
      padding: 0.9rem;
      background: rgba(2, 6, 23, 0.7);
      color: #dbeafe;
      border-radius: 0.8rem;
      overflow: auto;
      border: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .button {
      border: 0;
      border-radius: 0.8rem;
      padding: 0.72rem 1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .button.approve { background: linear-gradient(135deg, #34d399, #10b981); color: #03281a; }
    .button.deny { background: linear-gradient(135deg, #fb7185, #ef4444); color: #2b0208; }
    .button.secondary { background: rgba(148, 163, 184, 0.16); color: var(--text); }

    .muted { color: var(--muted); }
    .section-list { display: grid; gap: 0.7rem; }
    .session-link {
      display: block;
      padding: 0.8rem 0.9rem;
      border-radius: 0.85rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .session-link.active { border-color: rgba(125, 211, 252, 0.45); box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.14); }

    .timeline { display: grid; gap: 0.75rem; }
    .event {
      padding: 0.9rem;
      border-radius: 0.9rem;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(255, 255, 255, 0.03);
    }
    .event-head {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    .event-type { font-weight: 800; }
    .event-time { color: var(--muted); font-size: 0.88rem; }

    .nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .nav a {
      padding: 0.55rem 0.9rem;
      border-radius: 0.7rem;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .nav a:hover { text-decoration: none; background: rgba(125, 211, 252, 0.12); }

    @media (max-width: 920px) {
      .hero, .grid { grid-template-columns: 1fr; display: grid; }
      .stats { text-align: left; min-width: 0; }
      .hero { align-items: start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="nav" aria-label="Primary">
      <a href="/chat">Chat</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/query-builder">Query Builder</a>
      <a href="/approval-queue">Approval Queue</a>
      <a href="/traces">Trace Replay</a>
      <a href="/memory-inspector">Memory Inspector</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
