[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-guardrails"
version = "1.6.7"
description = "Safety-first agentic system with tool use, memory, and SQL guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetSentry Development Team" }]
keywords = ["agent", "llm", "guardrails", "sql", "fastapi", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.39.0",
    "sqlglot>=23.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.9",
    "openai>=1.50.0",
    "bcrypt>=4.0.0",
    "spacy>=3.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agentic-guardrails = "main:main"

[tool.setuptools]
packages = [
    "agent",
    "approval",
    "db",
    "guardrails",
    "tools",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
testpaths = ["tests"]

[tool.ruff.lint]
# Bug-class subset (syntax errors, undefined names, invalid comparisons) plus
# unused imports/locals (F401/F841) — behavior is the test suite's job.
# Kept in sync with the CI static-checks job.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
