{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h1>Register</h1>
    <p>Create an account. You will be signed in immediately — no demo passwords are seeded anywhere.</p>
  </div>
</section>

<section class="grid" style="grid-template-columns: minmax(0, 28rem) 1fr;">
  <article class="card">
    <div class="card-header">
      <h2>Create account</h2>
    </div>
    <div class="card-body">
      {% if error %}
      <div class="approval" role="alert" style="border-color: rgba(251, 113, 133, 0.45); margin-bottom: 1rem;">
        <p style="margin: 0;">{{ error }}</p>
      </div>
      {% endif %}
      <form method="post" action="/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="stack">
          <label class="muted" for="register-email">Email
            <input id="register-email" name="email" type="email" required autocomplete="email"
                   style="display: block; width: 100%; margin-top: 0.35rem; background: rgba(2, 6, 23, 0.7); border: 1px solid var(--panel-border); border-radius: 0.8rem; padding: 0.8rem 1rem; color: var(--text); font: inherit;">
          </label>
          <label class="muted" for="register-password">Password (min 8 characters)
            <input id="register-password" name="password" type="password" required autocomplete="new-password" minlength="8"
                   style="display: block; width: 100%; margin-top: 0.35rem; background: rgba(2, 6, 23, 0.7); border: 1px solid var(--panel-border); border-radius: 0.8rem; padding: 0.8rem 1rem; color: var(--text); font: inherit;">
          </label>
          <button class="button approve" type="submit">Create account</button>
        </div>
      </form>
      <p class="muted" style="margin-top: 1rem;">Already have an account? <a href="/login">Login</a>.</p>
    </div>
  </article>
</section>
{% endblock %}
