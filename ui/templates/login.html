{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h1>Login</h1>
    <p>Sign in to use the agent. Sessions, traces, and approvals are scoped to your account.</p>
  </div>
</section>

<section class="grid" style="grid-template-columns: minmax(0, 28rem) 1fr;">
  <article class="card rv">
    <div class="card-header">
      <h2>Sign in</h2>
    </div>
    <div class="card-body">
      {% if error %}
      <div class="approval" role="alert" style="border-color: var(--brick); margin-bottom: 1rem;">
        <p style="margin: 0;">{{ error }}</p>
      </div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="stack">
          <label class="muted" for="login-email">Email
            <input id="login-email" name="email" type="email" required autocomplete="email"
                   style="display: block; width: 100%; margin-top: 0.35rem;">
          </label>
          <label class="muted" for="login-password">Password
            <input id="login-password" name="password" type="password" required autocomplete="current-password"
                   style="display: block; width: 100%; margin-top: 0.35rem;">
          </label>
          <button class="button approve" type="submit">Login</button>
        </div>
      </form>
      <p class="muted" style="margin-top: 1rem;">No account? <a href="/register">Register</a>.</p>
    </div>
  </article>
</section>
{% endblock %}
