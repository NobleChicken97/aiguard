# Production overlay for single-box deploys (free-tier EC2): TLS entrypoint
# plus restart policies so the stack survives reboots. Base file untouched —
# local `docker compose up` keeps working exactly as before.
#
# Usage on the box:
#   DOMAIN=demo.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    container_name: aiguard-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN to your public hostname}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
