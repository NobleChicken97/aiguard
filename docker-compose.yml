services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiguard-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=data/guardrails.db
    volumes:
      # Keep the SQLite database on the host so it survives container rebuilds.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
      
  postgres:
    image: postgres:15-alpine
    container_name: aiguard-postgres
    environment:
      - POSTGRES_USER=aiguard
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=aiguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiguard -d aiguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
